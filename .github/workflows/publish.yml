name: Publish to npm

# Manual trigger. Publishing uses npm trusted publishing (OIDC provenance).
# To enable it, add a Trusted Publisher for this package on npmjs.com pointing at
# this repo, this workflow, and the `release` environment, then run this workflow
# from the Actions tab. Until trusted publishing is configured, releases are
# published from the maintainer host, so a tag push intentionally does NOT auto-run
# this (which would otherwise fail before the publisher exists).
on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'yarn'
      - run: yarn install --immutable
      - run: yarn build
      - run: yarn test
      - run: npm publish --provenance --access public
